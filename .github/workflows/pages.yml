name: Pages

on:
  push:
    branches: ["main"]
    paths: ["legal/*.html", "legal/favicon.png"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed for the "Carry forward the latest iOS debug build" step's
  # `gh run list`/`gh run download` calls.
  actions: read

# Only one Pages deployment can run at a time; a newer push should win over an
# in-flight older one rather than queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The Pages site is just the files in legal/, copied as-is — no build step
      # since they're already self-contained static HTML. privacy-policy.html is
      # also copied to index.html so the existing root URL (already submitted to
      # Play Console) keeps working; every other page keeps its own filename
      # (e.g. child-safety-standards.html), and the pages cross-link by relative
      # path, so this must stay a flat copy, not a rename.
      - name: Prepare site
        run: |
          mkdir -p _site
          cp legal/*.html _site/
          cp legal/privacy-policy.html _site/index.html
          cp legal/favicon.png _site/

      # A Pages deployment replaces the whole site — it doesn't merge with
      # what's already live. This run was only triggered by a legal/ change,
      # so without this step it would silently wipe out whatever the last
      # ios-debug-build.yml run published under /ios-debug/. Pull that run's
      # output forward instead (same "download the latest successful run's
      # artifact" pattern tests.yml uses for coverage baselines). If no
      # ios-debug-build.yml run has ever succeeded, there's nothing to carry
      # forward yet — skip gracefully.
      - name: Carry forward the latest iOS debug build, if any
        run: |
          mkdir -p _site/ios-debug
          LATEST=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow ios-debug-build.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -n "$LATEST" ]; then
            gh run download "$LATEST" \
              --repo "${{ github.repository }}" \
              --name ios-debug-ota \
              --dir _site/ios-debug \
            || echo "Latest ios-debug-build.yml run has no ios-debug-ota artifact (expired or predates this workflow), skipping."
          else
            echo "No successful ios-debug-build.yml run yet, skipping."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
