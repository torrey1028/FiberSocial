name: Release Android

# See the twin comment in release-ios.yml: this used to be one job inside
# release.yml that built and immediately published. It's now split into a
# build-rc job (build, test, publish as a prerelease, push to the Play
# testing track) and a promote job gated on manual QA sign-off (#265, #<QA
# gate issue>).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build-rc:
    runs-on: ubuntu-latest
    # Serialize release runs (each tag is a distinct ref, so a per-ref group
    # wouldn't help): two tags pushed close together would otherwise race, and
    # whichever job finished *last* would win the `--latest` marker — the exact
    # stale-latest bug the old android-build.yml concurrency comment described.
    concurrency:
      group: release-android
      cancel-in-progress: false
    # Needed to create the GitHub Release via the default GITHUB_TOKEN.
    permissions:
      contents: write

    outputs:
      aab-path: ${{ steps.paths.outputs.aab }}
      apk-path: ${{ steps.paths.outputs.apk }}

    steps:
      # fetch-depth: 0 (not the shallow default) so `git describe --tags
      # --exact-match` in app/build.gradle.kts can actually resolve this tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # scripts/release.sh enforces tagging from an up-to-date main, but a
      # hand-pushed tag bypasses it entirely — recheck server-side. And when a
      # commit carries more than one release tag, `git describe --exact-match`
      # picks one by its own priority rules, not the tag that triggered this
      # run, so the APK's baked-in version could silently mismatch the release
      # it ships under. Assert both before spending a build.
      - name: Verify tag is on main and resolves unambiguously
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on origin/main. Cut release tags from main via scripts/release.sh."
            exit 1
          fi
          described="$(git describe --tags --exact-match --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [ "$described" != "$GITHUB_REF_NAME" ]; then
            echo "::error::git describe resolves this commit to '${described:-<nothing>}' but the pushed tag is '$GITHUB_REF_NAME', so the built APK's version would not match the release. Delete the conflicting tag(s) on this commit and re-push."
            exit 1
          fi

      # Same fail-fast gate android-build.yml runs: a cross-module top-level
      # class collision compiles fine and only crashes at runtime (#155/#156) —
      # don't let one ship in a release candidate.
      - name: Check for cross-module class collisions
        run: python3 scripts/check_module_collisions.py

      # Unlike android-build.yml's soft-skip-if-missing behavior, this fails
      # loudly: a pushed release tag that silently produces nothing would be
      # far more confusing than one that produces an error.
      - name: Verify release secrets are configured
        env:
          RAVELRY_CLIENT_ID: ${{ secrets.RAVELRY_CLIENT_ID }}
          RAVELRY_CLIENT_SECRET: ${{ secrets.RAVELRY_CLIENT_SECRET }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          [ -z "$RAVELRY_CLIENT_ID" ] && missing="$missing RAVELRY_CLIENT_ID"
          [ -z "$RAVELRY_CLIENT_SECRET" ] && missing="$missing RAVELRY_CLIENT_SECRET"
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ] && missing="$missing PLAY_SERVICE_ACCOUNT_JSON"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repo secret(s):$missing. Add them at Settings > Secrets and variables > Actions before pushing a release tag."
            exit 1
          fi
          if [ -z "${{ vars.PLAY_TESTING_TRACK }}" ]; then
            echo "::error::Missing required repo variable PLAY_TESTING_TRACK (the Play Console track alias to push release candidates to, e.g. 'internal'). Add it at Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      # JDK + local.properties + Gradle all come from the shared composite action
      # (#274). `secrets` isn't available inside a composite, so each value is
      # passed in explicitly here. The verify step above guarantees the six
      # signing/OAuth secrets are non-empty by this point, so the action's
      # signing block always fires here.
      - name: Set up Android build environment
        uses: ./.github/actions/setup-android-build
        with:
          ravelry-client-id: ${{ secrets.RAVELRY_CLIENT_ID }}
          ravelry-client-secret: ${{ secrets.RAVELRY_CLIENT_SECRET }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # #265: release.yml used to publish without ever running the unit-test
      # suites, relying only on the fact the tag's commit had passed PR CI at
      # some earlier point. Run the same suites tests.yml/android-build.yml run
      # on this exact commit before building anything signed — a failure here
      # blocks the release candidate outright. Coverage-baseline comparison is
      # a PR-diff feature and doesn't apply to a release build, so this runs
      # the plain test tasks rather than the coverage report tasks.
      - name: Run unit test suites
        working-directory: src/platform/android
        run: ./gradlew :common:jvmTest :common:testDebugUnitTest :composeApp:testDebugUnitTest :app:testDebugUnitTest

      # Both tasks share the same release signingConfig (see app/build.gradle.kts) and
      # most of the same compile/resource work, so building them in one Gradle
      # invocation avoids a second cold JVM/config pass. The AAB is what Play Console
      # requires; the APK stays the direct-download artifact.
      - name: Build signed release APK and AAB
        working-directory: src/platform/android
        run: ./gradlew assembleRelease bundleRelease

      - name: Record artifact paths
        id: paths
        run: |
          echo "aab=src/platform/android/app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_OUTPUT"
          echo "apk=src/platform/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"

      # Persisted so the promote job can push the exact same tested bytes to
      # the production track and attach them to the promoted GitHub Release,
      # without rebuilding from source a second time.
      - name: Upload build artifacts for promotion
        uses: actions/upload-artifact@v4
        with:
          name: release-android-artifacts
          path: |
            ${{ steps.paths.outputs.aab }}
            ${{ steps.paths.outputs.apk }}
          retention-days: 30

      # $GITHUB_REF_NAME is the tag name (e.g. v1.2.0) for a tag-push event.
      # --generate-notes pulls auto-generated release notes from merged PRs
      # since the previous tag. --prerelease (and no --latest) is the whole
      # point of this job: this is a release *candidate*, not the released
      # build — the `promote` job below flips it in place once QA signs off.
      - name: Publish GitHub Release as a release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.paths.outputs.apk }}" \
            "${{ steps.paths.outputs.aab }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease

      # Play accepts re-uploading the exact bundle bytes it's already seen for
      # a given versionCode, so uploading again to a different track at
      # promotion time (see the `promote` job) is the standard way to move a
      # release between tracks with this action — see that job's comment for
      # why this isn't a rebuild.
      - name: Upload AAB to Play Console testing track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.myhobbyislearning.fibersocial
          releaseFiles: ${{ steps.paths.outputs.aab }}
          track: ${{ vars.PLAY_TESTING_TRACK }}
          status: completed

      # The `android-release` environment (configured with required reviewers
      # in Settings > Environments) is what actually pauses the `promote` job
      # below — this summary just tells the approving reviewer what to check
      # before they click Approve.
      - name: Write QA summary
        run: |
          {
            echo "## Release candidate $GITHUB_REF_NAME is ready for QA"
            echo ""
            echo "- Install from the Play Console **${{ vars.PLAY_TESTING_TRACK }}** testing track, or download the prerelease APK from the [GitHub Release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)."
            echo "- Run through [docs/android-release-qa-checklist.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/android-release-qa-checklist.md)."
            echo "- Once QA passes, approve the \`android-release\` environment on the \`promote\` job of this run to push to production and flip the GitHub Release live."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: build-rc
    runs-on: ubuntu-latest
    concurrency:
      group: release-android
      cancel-in-progress: false
    permissions:
      contents: write
    # Required reviewers on this environment (Settings > Environments >
    # android-release) are the actual manual-QA gate: this job sits paused in
    # the Actions UI until someone who has run the QA checklist against the
    # release candidate above approves it.
    environment:
      name: android-release

    steps:
      - uses: actions/checkout@v4

      - name: Download release candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-android-artifacts
          path: rc-artifacts

      # This is "promotion" in effect but a re-upload in mechanism: Play's API
      # (and this action, which has no metadata-only track-promote mode — see
      # its action.yml) always requires a bundle file per upload. What matters
      # is that these are the *exact same bytes* built and tested in build-rc,
      # not a fresh build from source — no new compile happens here.
      - name: Promote AAB to production track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.myhobbyislearning.fibersocial
          releaseFiles: rc-artifacts/app-release.aab
          track: production
          status: completed

      # Flips the one GitHub Release object for this tag from release
      # candidate to released — this is what moves the public
      # releases/latest/download/app-release.apk link documented in the root
      # CLAUDE.md.
      - name: Promote GitHub Release from candidate to released
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
