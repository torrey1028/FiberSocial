name: Release Android

# See the twin file release-ios.yml: this used to be the `release` job inside
# release.yml, building signed artifacts and publishing them immediately on
# every tag push with no automated tests and no QA gate. It's now split into
# a build-rc job (test, build, publish as a prerelease, push to the Play
# testing track) and a promote job gated on manual QA sign-off (#265).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Lets the test/build/signing pipeline be dry-run tested without cutting a
  # real version tag — mirrors release-ios.yml's workflow_dispatch, with one
  # necessary difference: iOS can use a sentinel "0.0.0" marketing version
  # because that's the one value scripts/release.sh rejects, so it can never
  # collide with a real TestFlight build. Android has no equivalent safe
  # sentinel — build.gradle.kts's own versionCode derivation also rejects
  # "0.0.0" (it packs to versionCode 0, which Android disallows), and Play
  # Console requires versionCode to strictly increase across the app's
  # *entire* release history, not per-track, so there's no reserved value a
  # dry run could safely reuse without either risking a real collision or
  # widening build.gradle.kts's validated range. A dispatch run therefore
  # skips the tag-only steps below (Play Console upload, GitHub Release
  # create/promote) — it still exercises the tests and the signed release
  # build itself, which is the fragile part.
  workflow_dispatch:

jobs:
  build-rc:
    runs-on: ubuntu-latest
    # Serialize release runs (each tag is a distinct ref, so a per-ref group
    # wouldn't help): two tags pushed close together would otherwise race, and
    # whichever job finished *last* would win the `--latest` marker — the exact
    # stale-latest bug the old android-build.yml concurrency comment described.
    concurrency:
      group: release-android
      cancel-in-progress: false
    # Needed to create the GitHub Release via the default GITHUB_TOKEN.
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 (not the shallow default) so `git describe --tags
      # --exact-match` in app/build.gradle.kts can actually resolve this tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # scripts/release.sh enforces tagging from an up-to-date main, but a
      # hand-pushed tag bypasses it entirely — recheck server-side. And when a
      # commit carries more than one release tag, `git describe --exact-match`
      # picks one by its own priority rules, not the tag that triggered this
      # run, so the APK's baked-in version could silently mismatch the release
      # it ships under. Assert both before spending a build.
      - name: Verify tag is on main and resolves unambiguously
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on origin/main. Cut release tags from main via scripts/release.sh."
            exit 1
          fi
          described="$(git describe --tags --exact-match --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [ "$described" != "$GITHUB_REF_NAME" ]; then
            echo "::error::git describe resolves this commit to '${described:-<nothing>}' but the pushed tag is '$GITHUB_REF_NAME', so the built APK's version would not match the release. Delete the conflicting tag(s) on this commit and re-push."
            exit 1
          fi

      # Same fail-fast gate android-build.yml runs: a cross-module top-level
      # class collision compiles fine and only crashes at runtime (#155/#156) —
      # don't let one ship in a release candidate.
      - name: Check for cross-module class collisions
        run: python3 scripts/check_module_collisions.py

      # Unlike android-build.yml's soft-skip-if-missing behavior, this fails
      # loudly: a pushed release tag that silently produces nothing would be
      # far more confusing than one that produces an error.
      - name: Verify release secrets are configured
        env:
          RAVELRY_CLIENT_ID: ${{ secrets.RAVELRY_CLIENT_ID }}
          RAVELRY_CLIENT_SECRET: ${{ secrets.RAVELRY_CLIENT_SECRET }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Same reasoning as the setup-android-build composite action's
          # "Write local.properties" step: route through env rather than
          # ${{ }} inside the script, so a value containing shell
          # metacharacters can't inject commands here.
          PLAY_TESTING_TRACK: ${{ vars.PLAY_TESTING_TRACK }}
        run: |
          missing=""
          [ -z "$RAVELRY_CLIENT_ID" ] && missing="$missing RAVELRY_CLIENT_ID"
          [ -z "$RAVELRY_CLIENT_SECRET" ] && missing="$missing RAVELRY_CLIENT_SECRET"
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ] && missing="$missing PLAY_SERVICE_ACCOUNT_JSON"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repo secret(s):$missing. Add them at Settings > Secrets and variables > Actions before pushing a release tag."
            exit 1
          fi
          if [ -z "$PLAY_TESTING_TRACK" ]; then
            echo "::error::Missing required repo variable PLAY_TESTING_TRACK (the Play Console track alias to push release candidates to, e.g. 'internal'). Add it at Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      # JDK + local.properties + Gradle all come from the shared composite action
      # (#274). `secrets` isn't available inside a composite, so each value is
      # passed in explicitly here. The verify step above guarantees the six
      # signing/OAuth secrets are non-empty by this point, so the action's
      # signing block always fires here.
      - name: Set up Android build environment
        uses: ./.github/actions/setup-android-build
        with:
          ravelry-client-id: ${{ secrets.RAVELRY_CLIENT_ID }}
          ravelry-client-secret: ${{ secrets.RAVELRY_CLIENT_SECRET }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # #265: release.yml used to publish without ever running the unit-test
      # suites, relying only on the fact the tag's commit had passed PR CI at
      # some earlier point. Run the same suites tests.yml/android-build.yml run
      # on this exact commit before building anything signed — a failure here
      # blocks the release candidate outright. Coverage-baseline comparison is
      # a PR-diff feature and doesn't apply to a release build, so this runs
      # the plain test tasks rather than the coverage report tasks.
      - name: Run unit test suites
        working-directory: src/platform/android
        run: ./gradlew :common:jvmTest :common:testDebugUnitTest :composeApp:testDebugUnitTest :app:testDebugUnitTest

      # Both tasks share the same release signingConfig (see app/build.gradle.kts) and
      # most of the same compile/resource work, so building them in one Gradle
      # invocation avoids a second cold JVM/config pass. The AAB is what Play Console
      # requires; the APK stays the direct-download artifact.
      - name: Build signed release APK and AAB
        working-directory: src/platform/android
        run: ./gradlew assembleRelease bundleRelease

      - name: Record artifact paths
        id: paths
        run: |
          echo "aab=src/platform/android/app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_OUTPUT"
          echo "apk=src/platform/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"

      # $GITHUB_REF_NAME is the tag name (e.g. v1.2.0) for a tag-push event.
      # --generate-notes pulls auto-generated release notes from merged PRs
      # since the previous tag. --prerelease (and no --latest) is the whole
      # point of this job: this is a release *candidate*, not the released
      # build — the `promote` job below flips it in place once QA signs off.
      - name: Publish GitHub Release as a release candidate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.paths.outputs.apk }}" \
            "${{ steps.paths.outputs.aab }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease

      # The only upload this versionCode ever gets: Play rejects re-uploading
      # a bundle whose versionCode it's already seen on any track, so the
      # `promote` job below moves this exact release to production via the
      # Play Developer API's track-update endpoint instead of uploading again
      # — see that job's comment.
      - name: Upload AAB to Play Console testing track
        if: github.event_name == 'push'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.myhobbyislearning.fibersocial
          releaseFiles: ${{ steps.paths.outputs.aab }}
          track: ${{ vars.PLAY_TESTING_TRACK }}
          status: completed

      # The `android-release` environment (configured with required reviewers
      # in Settings > Environments) is what actually pauses the `promote` job
      # below — this summary just tells the approving reviewer what to check
      # before they click Approve.
      - name: Write QA summary
        if: github.event_name == 'push'
        env:
          # Same reasoning as "Verify release secrets are configured": route
          # through env rather than ${{ }} inside the script.
          PLAY_TESTING_TRACK: ${{ vars.PLAY_TESTING_TRACK }}
        run: |
          {
            echo "## Release candidate $GITHUB_REF_NAME is ready for QA"
            echo ""
            echo "- Install from the Play Console **$PLAY_TESTING_TRACK** testing track, or download the prerelease APK from the [GitHub Release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)."
            echo "- Run through [docs/android-release-qa-checklist.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/android-release-qa-checklist.md)."
            echo "- Once QA passes, approve the \`android-release\` environment on the \`promote\` job of this run to push to production and flip the GitHub Release live."
          } >> "$GITHUB_STEP_SUMMARY"

      # Dispatch runs stop here — see the on.workflow_dispatch comment for
      # why the Play Console/GitHub Release steps above are push-only.
      - name: Write dry-run summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "## Dry run complete"
            echo ""
            echo "Tests passed and the release APK/AAB built and signed successfully."
            echo "The Play Console upload, GitHub Release, and \`promote\` steps only run"
            echo "on a real version-tag push — see the \`workflow_dispatch\` comment in"
            echo "this workflow file for why."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: build-rc
    # Dispatch (dry-run) builds never reach this job: with no real tag there's
    # no GitHub Release to promote and no guaranteed-safe versionCode to push
    # to Play's production track — see the on.workflow_dispatch comment above.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # No concurrency group here (unlike build-rc): this job can sit paused for
    # however long manual QA/approval takes, and needs.build-rc.outputs already
    # scopes it to this run's own RC — sharing build-rc's `release-android`
    # group would make a still-pending approval block every later run's
    # build-rc (a real release fix-forward) from even starting.
    permissions:
      contents: write
    # Required reviewers on this environment (Settings > Environments >
    # android-release) are the actual manual-QA gate: this job sits paused in
    # the Actions UI until someone who has run the QA checklist against the
    # release candidate above approves it.
    environment:
      name: android-release

    steps:
      # A real run (v0.3.0) proved the assumption this job used to be built
      # on wrong: Play's API rejects re-uploading a bundle whose versionCode
      # has already been used on *any* track ("Version code N has already
      # been used"), and build-rc's upload to PLAY_TESTING_TRACK already used
      # this release's versionCode. So promotion can't be "re-upload the same
      # bytes to a different track" (there is no such thing, mechanically,
      # for a versionCode Play has already seen) — it has to be a real
      # track-to-track move of the existing release via the Play Developer
      # API's edits.tracks endpoints, which reference the already-uploaded
      # versionCode instead of uploading anything.
      #
      # Mirrors app/build.gradle.kts's versionCode packing so this promote
      # job can identify which release on the source track to move, without
      # needing build-rc to hand it the value via an artifact/output.
      - name: Determine expected versionCode
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' doesn't match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          echo "version_code=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # google-api-python-client/google-auth aren't preinstalled on the
      # runner image (unlike, say, a Node action's bundled deps) — install
      # them fresh rather than hand-rolling the JWT-bearer OAuth flow with
      # raw HTTP calls.
      - name: Move the release from the testing track to production
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TESTING_TRACK: ${{ vars.PLAY_TESTING_TRACK }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          pip install --quiet google-api-python-client google-auth
          python3 -c '
          import json, os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          package_name = "com.myhobbyislearning.fibersocial"
          source_track = os.environ["PLAY_TESTING_TRACK"]
          version_code = int(os.environ["VERSION_CODE"])

          credentials = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          service = build("androidpublisher", "v3", credentials=credentials)
          edits = service.edits()

          edit_id = edits.insert(body={}, packageName=package_name).execute()["id"]

          releases = edits.tracks().get(
              editId=edit_id, packageName=package_name, track=source_track,
          ).execute().get("releases", [])
          release = next((r for r in releases if version_code in [int(v) for v in r.get("versionCodes", [])]), None)
          if release is None:
              found = [r.get("versionCodes") for r in releases]
              raise SystemExit(
                  f"No release with versionCode {version_code} found on the {source_track!r} track "
                  f"(found: {found}). build-rc may not have finished uploading it yet, or it landed "
                  f"on a different track."
              )

          edits.tracks().update(
              editId=edit_id, packageName=package_name, track="production",
              body={"track": "production", "releases": [release]},
          ).execute()
          edits.commit(editId=edit_id, packageName=package_name).execute()

          print(f"Promoted versionCode {version_code} ({release.get('name', '?')}) from {source_track!r} to production.")
          '

      # Flips the one GitHub Release object for this tag from release
      # candidate to released — this is what moves the public
      # releases/latest/download/app-release.apk link documented in the root
      # CLAUDE.md.
      - name: Promote GitHub Release from candidate to released
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
