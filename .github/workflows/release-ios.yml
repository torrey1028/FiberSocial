name: Release iOS

# See the twin file release-android.yml: this used to be the `ios-release`
# job inside release.yml, uploading straight to App Store Connect on every
# tag push with no automated tests and no QA gate. It's now split into a
# build-rc job (test, archive, upload) and a promote job gated on manual QA
# sign-off (#265). QA testers get each build via the Internal Testing
# group's App Store Connect "Automatic distribution" — no CI step needed.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Lets the signing/upload pipeline be dry-run tested without cutting a real
  # version tag.
  workflow_dispatch:

jobs:
  build-rc:
    runs-on: macos-15
    concurrency:
      group: release-ios
      cancel-in-progress: false

    outputs:
      build-number: ${{ steps.version.outputs.build_number }}
      marketing-version: ${{ steps.version.outputs.marketing_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same check the Android job runs, adjusted for workflow_dispatch: a
      # dry-run has no tag to validate against, so it skips straight to the
      # sentinel version below instead.
      - name: Verify tag is on main and resolves unambiguously
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on origin/main. Cut release tags from main via scripts/release.sh."
            exit 1
          fi
          described="$(git describe --tags --exact-match --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [ "$described" != "$GITHUB_REF_NAME" ]; then
            echo "::error::git describe resolves this commit to '${described:-<nothing>}' but the pushed tag is '$GITHUB_REF_NAME', so the archived build's version would not match the release. Delete the conflicting tag(s) on this commit and re-push."
            exit 1
          fi

      # Mirrors app/build.gradle.kts's versionCode packing (MAJOR*1_000_000 +
      # MINOR*1_000 + PATCH) so both platforms' release-over-release build
      # numbers stay in the same scheme. workflow_dispatch dry runs get a
      # sentinel marketing version that can never collide with a real
      # vMAJOR.MINOR.PATCH tag: scripts/release.sh explicitly rejects 0.0.0
      # (it's the one version that can never be a real release), with the
      # run number as the build number so repeated dry runs still satisfy
      # TestFlight's strictly-increasing build-number-per-version rule.
      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' doesn't match vMAJOR.MINOR.PATCH"
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            echo "marketing_version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
            echo "build_number=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"
          else
            echo "marketing_version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      # Compose Multiplatform 1.11's ui-uikit links against iOS 26 SDK symbols;
      # see the twin comment in tests.yml's common-ios-tests job.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # The build applies AGP even for the composeApp framework build, and
      # macOS runner images don't ship an Android SDK. Not folded into the
      # shared setup action (which can install the SDK via its
      # android-sdk-packages input): this job wants no local.properties and no
      # Gradle setup, so it uses the underlying action directly.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 platforms;android-36"

      # Fails loudly rather than quietly shipping a build that can't sign,
      # upload, or reach QA testers — same rationale as the Android job's
      # secret check.
      - name: Verify iOS release secrets are configured
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_ASC_API_KEY_BASE64: ${{ secrets.IOS_ASC_API_KEY_BASE64 }}
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          RAVELRY_CLIENT_ID: ${{ secrets.RAVELRY_CLIENT_ID }}
          RAVELRY_CLIENT_SECRET: ${{ secrets.RAVELRY_CLIENT_SECRET }}
        run: |
          missing=""
          [ -z "$IOS_DIST_CERTIFICATE_BASE64" ] && missing="$missing IOS_DIST_CERTIFICATE_BASE64"
          [ -z "$IOS_DIST_CERTIFICATE_PASSWORD" ] && missing="$missing IOS_DIST_CERTIFICATE_PASSWORD"
          [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] && missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -z "$IOS_ASC_API_KEY_BASE64" ] && missing="$missing IOS_ASC_API_KEY_BASE64"
          [ -z "$IOS_ASC_KEY_ID" ] && missing="$missing IOS_ASC_KEY_ID"
          [ -z "$IOS_ASC_ISSUER_ID" ] && missing="$missing IOS_ASC_ISSUER_ID"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID(variable)"
          [ -z "$RAVELRY_CLIENT_ID" ] && missing="$missing RAVELRY_CLIENT_ID"
          [ -z "$RAVELRY_CLIENT_SECRET" ] && missing="$missing RAVELRY_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repo secret(s)/variable(s):$missing. Add them at Settings > Secrets and variables > Actions before pushing a release tag."
            exit 1
          fi

      # Same pattern as local.properties elsewhere: secrets go through env +
      # printf %s, never ${{ }} inside the script, so a secret containing
      # quotes/$/backslashes can't corrupt the written file.
      - name: Write Config.local.xcconfig
        env:
          RAVELRY_CLIENT_ID: ${{ secrets.RAVELRY_CLIENT_ID }}
          RAVELRY_CLIENT_SECRET: ${{ secrets.RAVELRY_CLIENT_SECRET }}
        run: |
          {
            printf 'RAVELRY_CLIENT_ID = %s\n' "$RAVELRY_CLIENT_ID"
            printf 'RAVELRY_CLIENT_SECRET = %s\n' "$RAVELRY_CLIENT_SECRET"
          } > src/platform/ios/Config.local.xcconfig

      # #265: neither of these test suites used to run at release time —
      # only ordinary main pushes exercised them (tests.yml's
      # common-ios-tests and ios-app-build jobs). Run them here, on the exact
      # commit being released, before spending an archive build. A failure
      # blocks the release candidate outright.
      - name: Run common module iOS (Kotlin/Native) tests
        working-directory: src/platform/android
        run: ./gradlew :common:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test

      - name: Build the iOS app and run hosted XCTests
        working-directory: src/platform/ios
        run: |
          xcodebuild -project FiberSocial.xcodeproj -scheme FiberSocial \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tail -40

      # A temporary keychain scoped to this job, not the runner's login
      # keychain, so nothing signing-related persists past the job. The
      # keychain password itself needs no secret — it only has to survive
      # this one job.
      - name: Import distribution certificate
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
          echo "$IOS_DIST_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/dist_cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/dist_cert.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"
          PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -o - -)"
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/"$PROFILE_UUID".mobileprovision
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
        id: profile

      # Signing/version settings are passed as command-line build setting
      # overrides rather than committed to project.pbxproj, which stays
      # team-agnostic for other contributors' local automatic-signing builds.
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project src/platform/ios/FiberSocial.xcodeproj -scheme FiberSocial \
            -configuration Release -archivePath "$RUNNER_TEMP/FiberSocial.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE="${{ steps.profile.outputs.profile_uuid }}" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            archive

      # destination: upload (Xcode 13+) makes -exportArchive upload straight
      # to App Store Connect in the same step — no separate altool/notarytool
      # call needed. QA testers already reach this build with no further CI
      # step: the QA internal TestFlight group is configured in App Store
      # Connect (Internal Testing group settings) to auto-distribute every
      # new build, so there's nothing left to automate here.
      - name: Write exportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>destination</key>
            <string>upload</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.myhobbyislearning.fibersocial</key>
              <string>${{ steps.profile.outputs.profile_uuid }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      # Authenticating with an App Store Connect API key (rather than an
      # Apple ID) avoids interactive 2FA entirely, which is what makes this
      # step possible non-interactively in CI.
      - name: Export archive and upload to App Store Connect
        env:
          IOS_ASC_API_KEY_BASE64: ${{ secrets.IOS_ASC_API_KEY_BASE64 }}
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
        run: |
          echo "$IOS_ASC_API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FiberSocial.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$IOS_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$IOS_ASC_ISSUER_ID"

      # The `ios-release` environment (configured with required reviewers in
      # Settings > Environments) is what actually pauses the `promote` job
      # below — this summary just tells the approving reviewer what to check
      # before they click Approve.
      - name: Write QA summary
        env:
          # Same reasoning as "Write Config.local.xcconfig": route through env
          # rather than ${{ }} inside the script, so a value containing shell
          # metacharacters can't inject commands into this step.
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
        run: |
          {
            echo "## Release candidate build $BUILD_NUMBER ($MARKETING_VERSION) is ready for QA"
            echo ""
            echo "- Install via TestFlight — the QA internal group is configured in App Store Connect to auto-distribute every new build, so no manual step is needed to get it there."
            echo "- Run through [docs/ios-device-checklist.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/ios-device-checklist.md)."
            echo "- Once QA passes, approve the \`ios-release\` environment on the \`promote\` job of this run. Note: that job cannot submit to the App Store for you (Apple review can't be API-triggered) — it's a reminder gate, not an automatic publish."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: build-rc
    runs-on: ubuntu-latest
    # No concurrency group here (unlike build-rc): this job can sit paused for
    # however long manual QA/approval takes, and needs.build-rc.outputs already
    # scopes it to this run's own RC — sharing build-rc's `release-ios` group
    # would make a still-pending approval block every later run's build-rc
    # (a real release fix-forward, or an unrelated workflow_dispatch dry run)
    # from even starting.
    # Required reviewers on this environment (Settings > Environments >
    # ios-release) are the actual manual-QA gate: this job sits paused in the
    # Actions UI until someone who has run the QA checklist against the
    # TestFlight build above approves it.
    environment:
      name: ios-release

    steps:
      # Apple review is asynchronous and can't be triggered via API, so
      # there's nothing left to automate here — App Store submission stays a
      # manual App Store Connect step. This job's value is the approval gate
      # itself (an audited "QA signed off" checkpoint) plus a clear handoff
      # message, not a publish action.
      - name: Record QA approval and hand off for manual App Store submission
        run: |
          {
            echo "## QA approved for build ${{ needs.build-rc.outputs.build-number }} (${{ needs.build-rc.outputs.marketing-version }})"
            echo ""
            echo "Next step (manual, cannot be automated): submit this build for App Store review in App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"
